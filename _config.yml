# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# ---------------------------
# Basic Site Settings
# ---------------------------
locale                   : "en-US"
site_theme               : "air" # 主题颜色，可选: "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Haoran Yang"
title_separator          : "-"
name                     : &name "Haoran Yang"
description              : "Haoran Yang's academic portfolio"
url                      : "https://thatsll.github.io" 
baseurl                  : "" 
repository               : "Thatsll/thatsll.github.io"

# ---------------------------
# Site Author (Sidebar Info)
# ---------------------------
author:
  # Biographic information
  avatar           : "profile.jpg"  # 确保你的 images 文件夹里有 profile.png 图片
  name             : "Haoran Yang"
  pronouns         : 
  bio              : "Information"
  location         : "Nanjing, Jiangsu Province, China"
  employer         : "Nanjing University"
  email            : "13577031790@163.com" 

  # Academic websites (已清空示例链接，填入你的真实链接即可显示)
  academia         : 
  arxiv            : 
  googlescholar    : 
  inspire-hep      : 
  impactstory      : 
  orcid            : 
  semantic         : 
  ssrn             : 
  pubmed           : 
  researchgate     : 
  scopus           : 
  zotero           : 

  # Repositories
  github           : "Thatsll"
  kaggle           : 

  # Social media (只保留了可能用到的，其他已清空)
  bluesky          : 
  facebook         : 
  instagram        : 
  linkedin         : 
  twitter          : 
  weibo            : 
  zhihu            : 
  # 其他未列出的社交媒体默认不显示

# ---------------------------
# Publication Category (即使隐藏了栏目，保留结构以防报错)
# ---------------------------
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# ---------------------------
# Site Settings
# ---------------------------
teaser                   :  
breadcrumbs              : false 
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               : false # 默认关闭评论

staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"

atom_feed:
  hide                   : false
  path                   : 

# SEO Related (留空即可)
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing (留空)
twitter:
  username               : 
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : 
og_description           : 
social:
  type                   : 
  name                   : 
  links                  : 

# Analytics (默认关闭)
analytics:
  provider               : "false"
  google:
    tracking_id          : 

# ---------------------------
# Reading Files
# ---------------------------
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ---------------------------
# Conversion
# ---------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ---------------------------
# Collections (关键修改：全部设为 output: false 以隐藏导航栏)
# ---------------------------
collections:
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: false
    permalink: /:collection/:path/
  portfolio:
    output: false
    permalink: /:collection/:path/
  talks:
    output: false
    permalink: /:collection/:path/

# ---------------------------
# Defaults (只保留 pages 和 posts，移除了其他栏目的配置)
# ---------------------------
defaults:
  # _posts (博客设置，如果你完全不想要博客，可以把这一段也删掉)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages (个人简介页面，必须保留)
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# ---------------------------
# Sass/SCSS
# ---------------------------
sass:
  sass_dir: _sass
  style: compressed

# ---------------------------
# Outputting
# ---------------------------
permalink: /:categories/:title/
timezone: Etc/UTC

# ---------------------------
# Plugins
# ---------------------------
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
