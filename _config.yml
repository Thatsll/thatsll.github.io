# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# ---------------------------
# Basic Site Settings
# ---------------------------
# ---------------------------
# 1. 基础站点设置 (Basic Site Settings)
# ---------------------------
locale                   : "zh-CN"                # 改为中文环境
title                    : "Haoran Yang"           # 网站标题
title_separator          : "-"
name                     : &name "Haoran Yang"
description              : "Haoran Yang's Personal Website"
url                      : "https://thatsll.github.io" 
baseurl                  : "" 
repository               : "Thatsll/thatsll.github.io"

# ---------------------------
# 2. 作者信息 (侧边栏显示内容)
# ---------------------------
author:
  avatar           : "profile.jpg"                 # 确保 images/profile.jpg 存在
  name             : "Haoran Yang"
  bio              : "Nanjing University Student"  # 简短自我介绍
  location         : "Nanjing, China"
  employer         : "Nanjing University"
  email            : "13577031790@163.com"
  
  # 只保留你真正在用的链接，没有填的可以直接删掉或留空
  github           : "Thatsll"
  # twitter        : 
  # linkedin       : 
  # weibo          : 

# ---------------------------
# 3. 构建与阅读设置 (Build & Read Settings)
# ---------------------------
markdown             : kramdown
highlighter          : rouge
lsi                  : false
excerpt_separator    : "\n\n"
incremental          : false

# Kramdown 配置 (保持默认即可)
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ---------------------------
# 4. 集合设置 (Collections) - 关键简化！
# ---------------------------
# 既然删除了所有功能页，这里可以全部注释掉或设为不输出
collections:
  teaching:
    output: false
  publications:
    output: false
  portfolio:
    output: false
  talks:
    output: false

# ---------------------------
# 5. 默认布局 (Defaults)
# ---------------------------
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false     # 单页不需要显示阅读时间
      comments: false      # 关闭评论
      share: false         # 关闭分享按钮
      related_posts: false # 关闭相关文章

# ---------------------------
# 6. 插件 (Plugins) - 仅保留最基础的
# ---------------------------
# GitHub Pages 自动支持这些，无需额外安装
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# ---------------------------
# 7. 排除文件 (Exclude) - 保持默认，防止上传无关文件
# ---------------------------
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .gitignore
  - README.md
  - LICENSE

# ---------------------------
# 8. 其他杂项
# ---------------------------
timezone: Asia/Shanghai
permalink: /:title/
sass:
  sass_dir: _sass
  style: compressed
